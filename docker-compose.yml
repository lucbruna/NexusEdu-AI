services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexusedu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 20201020
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:20201020@db:5432/nexusedu
      JWT_SECRET_KEY: NEXUS_SECRET_CHANGE_ME_IN_PRODUCTION
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_HOURS: "168"
      HOST: "0.0.0.0"
      PORT: "8000"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,capacitor://localhost,http://localhost"
      RATE_LIMIT_PER_MINUTE: "30"
      MAX_UPLOAD_SIZE_MB: "50"
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  pgdata:
