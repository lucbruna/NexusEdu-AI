services:
  - type: web
    name: nexusedu-backend
    runtime: python
    rootDir: backend
    repo: https://github.com/lucbruna/NexusEdu-AI
    branch: main
    buildCommand: CARGO_HOME=/tmp/cargo pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexusedu-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_HOURS
        value: "168"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: TESSERACT_CMD
        value: "/usr/bin/tesseract"
    healthCheckPath: /docs

databases:
  - name: nexusedu-db
    plan: free
    databaseName: nexusedu
    user: nexusedu
