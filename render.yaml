services:
  - type: web
    name: nexusedu-backend
    runtime: docker
    repo: https://github.com/lucbruna/NexusEdu-AI
    branch: main
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexusedu-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_HOURS
        value: "168"
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"

databases:
  - name: nexusedu-db
    plan: free
    databaseName: nexusedu
    user: nexusedu
